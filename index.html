<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Ember Foundry</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    padding: 18px;
    text-align: center;
    background: #1b1b1b;
    border-bottom: 1px solid #333;
}

h1 {
    margin: 0;
}

.container {
    width: min(1100px, 94%);
    margin: 20px auto;
}

.game {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
}

.panel {
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 20px;
}

.gold {
    font-size: 42px;
    font-weight: bold;
    margin: 20px 0;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    font-size: 16px;
    cursor: pointer;
}

#farmButton {
    width: 100%;
    background: #f0a500;
    color: #111;
    font-weight: bold;
}

#farmButton:active {
    transform: scale(.98);
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid #444;
    background: #111;
    color: white;
    outline: none;
}

.nameRow {
    display: flex;
    gap: 8px;
}

.nameRow button {
    background: #444;
    color: white;
}

.status {
    margin-top: 12px;
    font-size: 13px;
    color: #aaa;
}

.chat {
    display: flex;
    flex-direction: column;
    height: 560px;
}

.chatMessages {
    flex: 1;
    overflow-y: auto;
    background: #101010;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
}

.message {
    margin-bottom: 9px;
    word-wrap: break-word;
}

.message .name {
    font-weight: bold;
    color: #f0a500;
}

.system {
    color: #777;
    font-style: italic;
    font-size: 13px;
}

.chatInput {
    display: flex;
    gap: 8px;
}

.chatInput input {
    flex: 1;
}

.chatInput button {
    background: #f0a500;
    color: #111;
    font-weight: bold;
}

.players {
    margin-top: 15px;
    color: #aaa;
}

.leaderboard {
    margin-top: 20px;
}

.leaderboard div {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid #292929;
}

@media (max-width: 800px) {
    .game {
        grid-template-columns: 1fr;
    }

    .chat {
        height: 450px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🔥 Ember Foundry</h1>
</header>

<div class="container">

    <div class="game">

        <!-- GAME -->
        <div>

            <div class="panel">

                <h2>🔥 Gold Foundry</h2>

                <div class="gold">
                    💰 <span id="gold">0</span>
                </div>

                <button id="farmButton">
                    🔨 Farm Gold +10
                </button>

                <div class="players">
                    🟢 Players online:
                    <span id="playerCount">0</span>
                </div>

                <div class="status" id="connectionStatus">
                    Connecting...
                </div>

            </div>

            <div class="panel" style="margin-top:20px">

                <h2>Player Name</h2>

                <div class="nameRow">
                    <input
                        id="nameInput"
                        maxlength="20"
                        placeholder="Enter your name"
                    >

                    <button id="nameButton">
                        Save
                    </button>
                </div>

            </div>

            <div class="panel leaderboard">

                <h2>🏆 Leaderboard</h2>

                <div id="leaderboard">
                    Loading...
                </div>

            </div>

        </div>

        <!-- CHAT -->
        <div class="panel chat">

            <h2>💬 Global Chat</h2>

            <div
                id="chatMessages"
                class="chatMessages"
            ></div>

            <div class="chatInput">

                <input
                    id="chatInput"
                    maxlength="200"
                    placeholder="Type a message..."
                    autocomplete="off"
                >

                <button id="sendButton">
                    Send
                </button>

            </div>

        </div>

    </div>

</div>

<script>

/*
=====================================================
IMPORTANT
=====================================================

Replace this with your Render server URL.

Example:

const SERVER_URL = "https://ember-foundry.onrender.com";

DO NOT put / at the end.
*/

const SERVER_URL = "https://YOUR-RENDER-APP.onrender.com";


let socket = null;

let gold = 0;

let playerName =
    localStorage.getItem("emberName") ||
    "Player";

const goldElement =
    document.getElementById("gold");

const playerCountElement =
    document.getElementById("playerCount");

const statusElement =
    document.getElementById("connectionStatus");

const chatMessages =
    document.getElementById("chatMessages");

const chatInput =
    document.getElementById("chatInput");

const nameInput =
    document.getElementById("nameInput");

nameInput.value = playerName;


/*
=====================================================
CONNECT
=====================================================
*/

function connect() {

    if (!SERVER_URL ||
        SERVER_URL.includes("https://tycoon-1-bt5n.onrender.com")) {

        statusElement.textContent =
            "https://tycoon-1-bt5n.onrender.com";

        return;
    }

    let wsUrl =
        SERVER_URL
            .replace("https://", "wss://")
            .replace("http://", "ws://");

    statusElement.textContent =
        "Connecting...";

    socket = new WebSocket(wsUrl);

    socket.addEventListener("open", () => {

        statusElement.textContent =
            "🟢 Connected";

        send({
            type: "setName",
            name: playerName
        });

        send({
            type: "getLeaderboard"
        });
    });

    socket.addEventListener("message", (event) => {

        let data;

        try {
            data = JSON.parse(event.data);
        } catch {
            return;
        }

        handleServerMessage(data);
    });

    socket.addEventListener("close", () => {

        statusElement.textContent =
            "🔴 Disconnected — reconnecting...";

        setTimeout(connect, 3000);
    });

    socket.addEventListener("error", () => {

        statusElement.textContent =
            "🔴 Connection error";
    });
}


/*
=====================================================
SEND
=====================================================
*/

function send(data) {

    if (!socket) return;

    if (socket.readyState !== WebSocket.OPEN) {
        return;
    }

    socket.send(JSON.stringify(data));
}


/*
=====================================================
SERVER MESSAGES
=====================================================
*/

function handleServerMessage(data) {

    if (data.type === "connected") {

        gold = Number(data.gold) || 0;

        updateGold();

        return;
    }

    if (data.type === "nameSet") {

        playerName = data.name;

        localStorage.setItem(
            "emberName",
            playerName
        );

        return;
    }

    if (data.type === "gold") {

        gold = Number(data.gold) || 0;

        updateGold();

        return;
    }

    if (data.type === "playerCount") {

        playerCountElement.textContent =
            data.count;

        return;
    }

    if (data.type === "chat") {

        addChatMessage(
            data.name,
            data.message
        );

        return;
    }

    if (data.type === "system") {

        addSystemMessage(
            data.message
        );

        return;
    }

    if (data.type === "chatError") {

        addSystemMessage(
            "⚠️ " + data.message
        );

        return;
    }

    if (data.type === "leaderboard") {

        displayLeaderboard(
            data.data
        );

        return;
    }
}


/*
=====================================================
GOLD
=====================================================
*/

function updateGold() {

    goldElement.textContent =
        gold.toLocaleString();
}


/*
=====================================================
FARM
=====================================================
*/

document
    .getElementById("farmButton")
    .addEventListener("click", () => {

        send({
            type: "claimGold"
        });
    });


/*
=====================================================
NAME
=====================================================
*/

document
    .getElementById("nameButton")
    .addEventListener("click", saveName);

nameInput.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {
        saveName();
    }
});

function saveName() {

    let name =
        nameInput.value.trim();

    if (!name) {
        name = "Player";
    }

    name = name
        .replace(/[<>]/g, "")
        .substring(0, 20);

    nameInput.value = name;

    playerName = name;

    localStorage.setItem(
        "emberName",
        name
    );

    send({
        type: "setName",
        name
    });
}


/*
=====================================================
CHAT
=====================================================
*/

document
    .getElementById("sendButton")
    .addEventListener("click", sendChat);

chatInput.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {
        event.preventDefault();
        sendChat();
    }
});

function sendChat() {

    const message =
        chatInput.value.trim();

    if (!message) return;

    send({
        type: "chat",
        message
    });

    chatInput.value = "";

    chatInput.focus();
}


/*
=====================================================
ADD CHAT MESSAGE
=====================================================
*/

function addChatMessage(name, message) {

    const wrapper =
        document.createElement("div");

    wrapper.className = "message";

    const nameElement =
        document.createElement("span");

    nameElement.className = "name";

    nameElement.textContent =
        name + ": ";

    const messageElement =
        document.createElement("span");

    messageElement.textContent =
        message;

    wrapper.appendChild(nameElement);
    wrapper.appendChild(messageElement);

    chatMessages.appendChild(wrapper);

    chatMessages.scrollTop =
        chatMessages.scrollHeight;

    // Keep the browser from filling with thousands
    // of old messages.
    while (chatMessages.children.length > 100) {
        chatMessages.removeChild(
            chatMessages.firstChild
        );
    }
}


/*
=====================================================
SYSTEM MESSAGE
=====================================================
*/

function addSystemMessage(message) {

    const element =
        document.createElement("div");

    element.className =
        "message system";

    element.textContent =
        message;

    chatMessages.appendChild(element);

    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}


/*
=====================================================
LEADERBOARD
=====================================================
*/

function displayLeaderboard(data) {

    const container =
        document.getElementById("leaderboard");

    container.innerHTML = "";

    if (!data || data.length === 0) {

        container.textContent =
            "No players yet.";

        return;
    }

    data.forEach((player, index) => {

        const row =
            document.createElement("div");

        const name =
            document.createElement("span");

        const amount =
            document.createElement("span");

        name.textContent =
            `${index + 1}. ${player.name}`;

        amount.textContent =
            `💰 ${Number(player.gold).toLocaleString()}`;

        row.appendChild(name);
        row.appendChild(amount);

        container.appendChild(row);
    });
}


/*
=====================================================
START
=====================================================
*/

connect();

</script>

</body>
  </html>
